code: azure-retirement-motion
name: Azure Retirement Motion
icon: 📡
description: |
  Runs the CSU "Azure Retirement Motion" end-to-end for a single customer:
  pulls Azure service/feature retirement and end-of-support data via the cloned
  Azure Service Retirements skill, orchestrates the existing customer PowerPoint
  deck, and produces per-retirement Excel exports, a consolidated execution /
  migration plan, plus internal motion artifacts (opportunity plan with rough
  ACR estimates, executive briefing, and a customer follow-up email).

language: en
domain: mixed   # research + analysis + technical-writing

agents_csv: ./squad-party.csv

skills:
  - web_search
  - web_fetch
  - file_read_write
  - code_execution
  - msx-dataverse
  - microsoft-graph-mail
  - belux-mal-coverage
  - retirement-intelligence-model
  # Microsoft Learn MCP — migration path enrichment
  - mcp_microsoftdocs_microsoft_docs_search
  - mcp_microsoftdocs_microsoft_docs_fetch

# External skill (not an MCP/native skill): the cloned Azure Service Retirements
# repo. Reese Retirement orchestrates it via its own AGENTS.md pipeline.
external_skills:
  - name: belux-fy27-mal
    path: "https://microsofteur.sharepoint.com/:x:/r/teams/microsoftbelux/_layouts/15/Doc.aspx?sourcedoc=%7B80308f7c-aa2d-4cb0-9fcf-e3f523ca6c9a%7D&action=default"
    entrypoint: "BELUX_FY27_MAL.xlsx / Account Coverage Matrix"
    requires: ["Microsoft 365 access"]
    source_document_id: "80308f7c-aa2d-4cb0-9fcf-e3f523ca6c9a"
    fiscal_year: "FY27"
    primary_access: "WorkIQ grounded to exact workbook URL"
    cache_artifact: "output/{run_id}/internal/MALCoverage.json"
    purpose: "Resolve Azure Specialist, CSAM, and AE once by exact TPID"
  - name: azure-service-retirements
    path: "C:/Users/lievenv/OneDrive - Microsoft/GitHub/retirements-agent"
    entrypoint: "AGENTS.md / agent-retirements/agent.md"
    requires: ["az login", "node >=18", "npm install"]
    auth_resource: "api://f748ae1d-5e8a-4aa0-bfb3-67beda3d3676"
    produces:
      - "CustomerData/<Customer>/retirements.json"
      - "CustomerData/<Customer>/RetirementAssessment-<customer>-YYYY-MM-DD.pptx"

data:
  - pipeline/data/domain-framework.md
  - pipeline/data/quality-criteria.md
  - pipeline/data/anti-patterns.md
  - pipeline/data/output-examples.md
  - pipeline/data/research-brief.md
  - pipeline/data/retirement-sources.md
  - pipeline/data/customer-confidentiality-guard.md

pipeline: ./pipeline/pipeline.yaml

retirement_motion_vteam:
  - name: Manoj Nair
    alias: Manoj.Nair
    email: Manoj.Nair@microsoft.com
    directory_id: 8a8f6763-b527-4dd3-aed0-ff5499edf497
  - name: Marcelo Lima
    alias: marcelolima
    email: marcelolima@microsoft.com
    directory_id: 785b9b8a-8688-40a3-86f6-a4363429f990

output_isolation:
  pattern: "output/{run_id}/"
  notes: |
    One run = one customer engagement. The Pipeline Runner creates a unique
    run_id (YYYY-MM-DD-HHmmss) and scopes every output under output/{run_id}/,
    giving inherent per-customer isolation. The customer name / TPID is captured
    as metadata in output/{run_id}/intake.md and logged in _memory/runs.md.

memory:
  squad: ./_memory/memories.md
  runs:  ./_memory/runs.md
